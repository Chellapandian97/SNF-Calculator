<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Milk Fat, SNF & CLR Calculator</title>
<style>
:root{--ink:#173247;--muted:#5e7481;--line:#ccd9e0;--soft:#eef6f8;--accent:#176b87}
*{box-sizing:border-box}body{margin:0;padding:18px;background:#f3f7f9;color:var(--ink);font-family:Arial,Helvetica,sans-serif}
main{max-width:560px;margin:18px auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 8px 24px rgba(23,50,71,.08)}
h1{font-size:24px;margin:0 0 8px}.intro{color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{min-width:0}
label{display:block;font-weight:700;font-size:14px;margin:0 0 7px}
input{width:100%;min-height:54px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:22px;color:var(--ink);background:#fff}
input:focus{outline:3px solid #c9e8f0;border-color:var(--accent)}
.hint{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.4}
.output{background:var(--soft);border:1px solid #d4e7ec;border-radius:12px}.output label{padding:13px 12px 0;margin:0}
.output input{font-weight:800;font-size:25px;background:transparent;border:0;color:var(--accent)}.output .hint{padding:0 12px 12px}
#message{min-height:18px;margin-top:12px;font-size:13px;color:#176b48;line-height:1.5}
.note{font-size:12px;color:var(--muted);line-height:1.55;margin-top:17px}
button{width:100%;min-height:48px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink);font-weight:700;font-size:15px;margin-top:16px}
@media(max-width:360px){main{padding:16px}.grid{gap:9px}input{font-size:20px;padding:10px}}
</style></head>
<body><main>
<h1>Milk Fat, SNF &amp; CLR Calculator</h1>

<div class="grid">
  <div class="field"><label for="fat">Fat (%)</label><input id="fat" type="text" inputmode="numeric" placeholder="" autocomplete="off" aria-describedby="fat-hint"></div>
  <div class="field"><label for="snf">SNF (%)</label><input id="snf" type="text" inputmode="numeric" placeholder="" autocomplete="off" aria-describedby="snf-hint"></div>
  <div class="field"><label for="clr">CLR (optional)</label><input id="clr" type="number" inputmode="decimal" placeholder="" autocomplete="off"></div>
  <div class="field output"><label for="answer">Result</label><input id="answer" type="text" readonly value="—" aria-live="polite"><div class="hint" id="answer-label">Enter Fat and SNF</div></div>
</div>
<div id="message" role="status" aria-live="polite">Chart lookup is used for Fat + SNF; formula is the fallback.</div>
<div class="note"><b>Formula</b><br>SNF = CLR ÷ 4 + (0.2 × Fat) + 0.36<br>CLR = 4 × [SNF − (0.2 × Fat) − 0.36]<br>Fat = [SNF − (CLR ÷ 4) − 0.36] ÷ 0.2</div>
<button type="button" id="clear">Clear all values</button>
</main>
<script>
(function(){
 const el={fat:document.getElementById('fat'),snf:document.getElementById('snf'),clr:document.getElementById('clr')};
 const answer=document.getElementById('answer'), label=document.getElementById('answer-label'), message=document.getElementById('message');
 // Transcribed SNF values from the user's photographed chart. Each row is Fat 3.5–5.5;
 // columns correspond to CLR 25.0, 25.5, ... 33.0.
 const clrCols=[25,25.5,26,26.5,27,27.5,28,28.5,29,29.5,30,30.5,31,31.5,32,32.5,33];
 const chart={
  35:[7.3,7.4,7.6,7.7,7.8,7.9,8.1,8.2,8.3,8.4,8.6,8.7,8.8,8.9,9.1,9.2,9.3],
  36:[7.3,7.5,7.6,7.7,7.8,8.0,8.1,8.2,8.3,8.5,8.6,8.7,8.8,9.0,9.1,9.2,9.3],
  37:[7.4,7.5,7.6,7.7,7.9,8.0,8.1,8.2,8.4,8.5,8.6,8.7,8.9,9.0,9.1,9.2,9.4],
  38:[7.4,7.5,7.6,7.7,7.9,8.0,8.1,8.2,8.3,8.5,8.6,8.7,8.9,9.0,9.1,9.3,9.4],
  39:[7.4,7.5,7.6,7.8,7.9,8.0,8.1,8.3,8.4,8.5,8.6,8.7,8.9,9.0,9.1,9.3,9.4],
  40:[7.4,7.5,7.7,7.8,7.9,8.0,8.2,8.3,8.4,8.5,8.6,8.8,8.9,9.0,9.2,9.3,9.4],
  41:[7.4,7.6,7.7,7.8,7.9,8.1,8.2,8.3,8.4,8.6,8.7,8.8,8.9,9.1,9.2,9.3,9.4],
  42:[7.5,7.6,7.7,7.8,8.0,8.1,8.2,8.3,8.5,8.6,8.7,8.8,9.0,9.1,9.2,9.3,9.4],
  43:[7.5,7.6,7.7,7.8,8.0,8.1,8.2,8.3,8.5,8.6,8.7,8.8,9.0,9.1,9.2,9.4,9.5],
  44:[7.5,7.6,7.7,7.9,8.0,8.1,8.2,8.4,8.5,8.6,8.7,8.9,9.0,9.1,9.3,9.4,9.5],
  45:[7.5,7.6,7.8,7.9,8.0,8.1,8.3,8.4,8.5,8.6,8.8,8.9,9.0,9.1,9.3,9.4,9.5],
  46:[7.5,7.7,7.8,7.9,8.0,8.2,8.3,8.4,8.5,8.7,8.8,8.9,9.0,9.2,9.3,9.4,9.5],
  47:[7.6,7.7,7.8,7.9,8.1,8.2,8.3,8.4,8.6,8.7,8.8,8.9,9.1,9.2,9.3,9.4,9.6],
  48:[7.6,7.7,7.8,7.9,8.1,8.2,8.3,8.4,8.6,8.7,8.8,8.9,9.1,9.2,9.3,9.5,9.6],
  49:[7.6,7.7,7.8,8.0,8.1,8.2,8.3,8.5,8.6,8.7,8.8,9.0,9.1,9.2,9.4,9.5,9.6],
  50:[7.6,7.7,7.9,8.0,8.1,8.2,8.4,8.5,8.6,8.7,8.9,9.0,9.1,9.2,9.4,9.5,9.6],
  51:[7.6,7.8,7.9,8.0,8.1,8.3,8.4,8.5,8.6,8.8,8.9,9.0,9.2,9.3,9.4,9.5,9.6],
  52:[7.7,7.8,7.9,8.0,8.2,8.3,8.4,8.5,8.7,8.8,8.9,9.0,9.2,9.3,9.4,9.5,9.7],
  53:[7.7,7.8,7.9,8.0,8.2,8.3,8.4,8.5,8.7,8.8,8.9,9.0,9.2,9.3,9.4,9.6,9.7],
  54:[7.7,7.8,7.9,8.1,8.2,8.3,8.4,8.6,8.7,8.8,8.9,9.1,9.2,9.3,9.4,9.6,9.7],
  55:[7.7,7.8,8.0,8.1,8.2,8.3,8.5,8.6,8.7,8.8,8.9,9.1,9.2,9.3,9.5,9.6,9.7]
 };
 function n(k){
  let v=el[k].value.trim();
  if(v==='') return null;
  const num=Number(v);
  if(!Number.isFinite(num)) return NaN;
  // Accept compact whole-number input (39 => 3.9) and preserve decimal input
  // (3.9 stays 3.9; 0.05 stays 0.05). Return actual percentage values here.
  if(k==='fat'||k==='snf'){
    return (Number.isInteger(num) && num >= 10) ? num/10 : num;
  }
  return num;
 }
 function formatTenthsInput(input){
  const raw=input.value.trim();
  if(!raw) return;
  const num=Number(raw);
  if(!Number.isFinite(num)) return;
  // Only convert compact integer entries such as 39 -> 3.9.
  // Do not round decimal values such as 0.05 or 3.95.
  if(Number.isInteger(num) && num>=10 && num<=999) input.value=(num/10).toFixed(1);
 }
 function show(v,heading,msg){answer.value=v;label.textContent=heading;message.textContent=msg}
 function run(changed){
  const f=n('fat'),s=n('snf'),c=n('clr');
  // Primary workflow: Fat + SNF -> chart lookup, then formula fallback.
  if(f!==null&&s!==null&&c===null){
   if(!Number.isFinite(f)||!Number.isFinite(s)){show('—','Check input','Enter valid Fat and SNF values (e.g. 3.9 and 7.7).');return}
   const row=chart[Math.round(f*10)], snfValue=s;
   if(row){
    const idx=row.findIndex(v=>Math.abs(v-snfValue)<0.0001);
    if(idx!==-1){const cv=clrCols[idx];show(cv.toFixed(2),'CLR from chart','Chart match found: Fat '+f.toFixed(2)+'%, SNF '+snfValue.toFixed(2)+'% → CLR '+cv.toFixed(1)+'.');return}
   }
   const result=4*(snfValue-0.2*f-0.36);
   show(result.toFixed(2),'CLR from formula','Exact combination not listed in chart. Formula used: CLR = '+result.toFixed(2)+'.');return;
  }
  // Optional inverse calculations when CLR is supplied.
  if(f!==null&&c!==null&&s===null){const r=c/4+0.2*f+0.36;show(r.toFixed(2),'Calculated SNF (%)','Calculated SNF = '+r.toFixed(2)+'%.');return}
  if(s!==null&&c!==null&&f===null){const r=(s-c/4-0.36)/0.2;show(r.toFixed(2),'Calculated Fat (%)','Calculated Fat = '+r.toFixed(2)+'%.');return}
  if(f!==null&&s!==null&&c!==null){show('—','Clear CLR input','For chart lookup, enter Fat and SNF and leave CLR blank.');return}
  show('—','Enter Fat and SNF','Chart lookup is used first; formula is the fallback.');
 }
 ['fat','snf','clr'].forEach(k=>el[k].addEventListener('input',()=>run(k)));
 ['fat','snf'].forEach(k=>el[k].addEventListener('blur',()=>{
   formatTenthsInput(el[k]);
   run(k);
 }));
 document.getElementById('clear').addEventListener('click',()=>{Object.values(el).forEach(x=>x.value='');show('—','Enter Fat and SNF','Chart lookup is used first; formula is the fallback.');el.fat.focus()});
})();
</script></body></html>
