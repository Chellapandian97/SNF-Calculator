<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aavin QA SNF Calculator</title>
<style>
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#0f766e,#2563eb);display:flex;justify-content:center;align-items:center;min-height:100vh;padding:16px}
.card{background:#fff;max-width:460px;width:100%;padding:22px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
h2{text-align:center;color:#0f766e;margin:0}
p{text-align:center;color:#666}
label{display:block;margin-top:12px;font-weight:600}
input{width:100%;padding:12px;font-size:17px;border:2px solid #d8e2ef;border-radius:12px;box-sizing:border-box}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.box{background:#f4f8ff;border-radius:14px;padding:12px;text-align:center}
.title{font-size:12px;color:#666}.value{font-size:24px;font-weight:bold}
.snf{grid-column:1/3;background:#16a34a;color:#fff}.snf .title,.snf .value{color:#fff}
.actions{display:flex;gap:10px;margin-top:16px}
button{flex:1;padding:12px;border:none;border-radius:12px;font-size:15px;font-weight:bold;cursor:pointer}
#showBtn{background:#2563eb;color:#fff}
#resetBtn{background:#ef4444;color:#fff}
#steps{display:none;margin-top:16px;background:#eef6ff;border-left:5px solid #2563eb;padding:12px;border-radius:10px;font-family:Consolas,monospace;font-size:14px;white-space:pre-line}
</style>
</head>
<body>
<div class="card">
<h2>🥛 Aavin QA SNF Calculator</h2>
<p>Reference Temperature: <b>29°C</b></p>

<label>Fat (%)</label>
<input id="fat" type="number" step="0.01">

<label>Observed LR</label>
<input id="lr" type="number" step="0.1">

<label>Milk Temperature (°C)</label>
<input id="temp" type="number" step="0.1" value="29">

<div class="grid">
<div class="box"><div class="title">Observed LR</div><div class="value" id="obs">--</div></div>
<div class="box"><div class="title">Corrected LR (CLR)</div><div class="value" id="clr">--</div></div>
<div class="box snf"><div class="title">SNF (%)</div><div class="value" id="snf">--</div></div>
</div>

<div class="actions">
<button id="showBtn" onclick="toggleCalc()">Show Calculation</button>
<button id="resetBtn" onclick="resetForm()">Reset</button>
</div>

<div id="steps"></div>

</div>

<script>
const fat=document.getElementById('fat');
const lr=document.getElementById('lr');
const temp=document.getElementById('temp');
const obs=document.getElementById('obs');
const clr=document.getElementById('clr');
const snf=document.getElementById('snf');
const steps=document.getElementById('steps');
const showBtn=document.getElementById('showBtn');

[fat,lr,temp].forEach(e=>e.addEventListener('input',calculate));

function calculate(){
let F=parseFloat(fat.value),LR=parseFloat(lr.value),T=parseFloat(temp.value);
obs.textContent=isNaN(LR)?"--":LR.toFixed(2);
if(isNaN(F)||isNaN(LR)||isNaN(T)){
clr.textContent="--";snf.textContent="--";
steps.innerHTML="";
return;
}
let correction=(T-29)*0.2;
let CLR=LR+correction;
let SNF=(CLR/4)+(0.2*F)+0.36;
clr.textContent=CLR.toFixed(2);
snf.textContent=SNF.toFixed(2);

steps.innerHTML="<b>Step 1: Temperature Correction</b><br>"
+"Correction = ("+T.toFixed(1)+" − 29) × 0.2 = "+correction.toFixed(2)+"<br>"
+"CLR = "+LR.toFixed(2)+" + "+correction.toFixed(2)+" = <b>"+CLR.toFixed(2)+"</b><br><br>"
+"<b>Step 2: SNF Calculation</b><br>"
+"SNF = (CLR ÷ 4) + (0.2 × FAT) + 0.36<br>"
+"= ("+CLR.toFixed(2)+" ÷ 4) + (0.2 × "+F.toFixed(2)+") + 0.36<br>"
+"= "+(CLR/4).toFixed(2)+" + "+(0.2*F).toFixed(2)+" + 0.36<br>"
+"= <b>"+SNF.toFixed(2)+" %</b>";
}

function toggleCalc(){
if(steps.style.display==="block"){
steps.style.display="none";
showBtn.textContent="Show Calculation";
}else{
steps.style.display="block";
showBtn.textContent="Hide Calculation";
}
}

function resetForm(){
fat.value="";
lr.value="";
temp.value="29";
steps.style.display="none";
showBtn.textContent="Show Calculation";
calculate();
}
calculate();
</script>
</body>
</html>
